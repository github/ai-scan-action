# Consumer-facing action, published from this directory to a standalone action repository.
name: AI Scan
description: Run AI Scan on the current repository to detect and report security vulnerabilities.

inputs:
  token:
    description: GitHub token used for Copilot requests and code scanning access.
    required: false
    default: ${{ github.token }}
  copilot-token:
    description: GitHub token used for Copilot requests only. Overrides token.
    required: false
    default: ''
  copilot-integration-id:
    description: GitHub Copilot integration ID used for Copilot requests.
    required: false
    default: ''
  tools:
    description: >
      Path to a locally built AI Scan tools archive, or a release tag on the
      action's own repository (defaults to `latest`) to download that asset
      from. For unset or `latest`, the `argus_action_use_upcoming_release` feature
      flag can select the `upcoming` release; failures fall back to `latest`.
      Any value that resolves to an existing file is used as-is; everything
      else is treated as a tag.
    required: false
    default: latest
  source-root:
    description: Path of the root source code directory, relative to $GITHUB_WORKSPACE.
    required: false
    default: .
  baseline-ref:
    description: Git ref of the baseline to compare against.
    required: false
    default: ${{ github.ref }}

runs:
  using: composite
  steps:
    - id: resolve
      shell: bash
      env:
        TOOLS: ${{ inputs.tools }}
        RELEASE_REPO: ${{ github.action_repository }}
        GH_TOKEN: ${{ inputs.token }}
      run: |
        # The first thing the action does, reported in telemetry as the
        # action's start time.
        action_started_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

        # Release tag of the tools archive, reported in telemetry. It stays
        # empty for a local archive, which telemetry treats as not known.
        implementation_version=
        if [[ -f "${TOOLS}" ]]; then
          echo "tools: using local tarball ${TOOLS}"
          tarball="${TOOLS}"
        else
          echo "tools: ${TOOLS} is not a file"
          tarball_basename=ai-scan.tar.xz
          tarball="${RUNNER_TEMP}/${tarball_basename}"
          authenticated_download=false

          # Releases of github/ai-scan-action are downloaded anonymously, so no
          # token is sent. Any other action repository downloads its releases
          # with authentication, using the action's token.
          if [[ "${RELEASE_REPO}" != "github/ai-scan-action" ]]; then
            authenticated_download=true
          fi

          resolve_latest_tag() {
            if [[ "${authenticated_download}" == "true" ]]; then
              GH_HOST=github.com gh release view \
                --repo "${RELEASE_REPO}" --json tagName --jq .tagName
            else
              # `releases/latest` redirects to `releases/tag/<tag>`. Following that
              # redirect is not subject to the per-IP rate limit that the
              # unauthenticated api.github.com has on shared runners.
              local latest_url
              latest_url="$(curl --fail --silent --show-error --retry 3 \
                --output /dev/null --write-out '%{redirect_url}' \
                "https://github.com/${RELEASE_REPO}/releases/latest")"
              printf '%s' "${latest_url##*/}"
            fi
          }

          download_release() {
            local release_tag="$1"
            rm -f "${tarball}"
            if [[ "${authenticated_download}" == "true" ]]; then
              echo "tools: downloading the release from ${RELEASE_REPO} with authentication using gh"
              GH_HOST=github.com gh release download "${release_tag}" \
                --repo "${RELEASE_REPO}" \
                --pattern "${tarball_basename}" \
                --output "${tarball}" || return 1
            else
              echo "tools: downloading the release from ${RELEASE_REPO} using curl"
              curl --fail --silent --show-error --location --retry 3 --output "${tarball}" \
                "https://github.com/${RELEASE_REPO}/releases/download/${release_tag}/${tarball_basename}" || return 1
            fi

            local archive_bun_version
            if ! archive_bun_version="$(tar -xJOf "${tarball}" ./ai-scan-bun-version)"; then
              echo "tools: release ${release_tag} has no readable ai-scan-bun-version stamp" >&2
              return 1
            fi
            if [[ ! "${archive_bun_version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "tools: release ${release_tag} has an invalid Bun version: ${archive_bun_version}" >&2
              return 1
            fi
            bun_version="${archive_bun_version}"
          }

          # `latest` moves, so resolve it to the release tag first. That tag is
          # what is downloaded and what telemetry reports as the version run.
          tag="${TOOLS}"
          if [[ -z "${tag}" || "${tag}" == "latest" ]]; then
            use_upcoming=false
            if upcoming_flag="$(GH_HOST=github.com gh api --method GET \
              "repos/${GITHUB_REPOSITORY}/code-scanning/ai-scan-action/features" \
              -f features=use_upcoming_release --jq '.use_upcoming_release' 2>/dev/null)" &&
              [[ "${upcoming_flag}" == "true" ]]; then
              use_upcoming=true
            else
              echo "::warning::Could not enable the upcoming AI Scan release; using latest"
            fi

            if [[ "${use_upcoming}" == "true" ]]; then
              tag=upcoming
              if ! download_release "${tag}"; then
                echo "::warning::Could not use the upcoming AI Scan release; falling back to latest"
                tag=
              fi
            fi

            if [[ -z "${tag}" || "${tag}" == "latest" ]]; then
              tag="$(resolve_latest_tag)"
            fi
            if [[ -z "${tag}" ]]; then
              echo "::error::Could not resolve the latest AI Scan release of ${RELEASE_REPO}"
              exit 1
            fi
            echo "tools: selected release ${tag}"
            if [[ "${tag}" != "upcoming" ]]; then
              if ! download_release "${tag}"; then
                echo "::error::Could not download or validate AI Scan release ${tag} from ${RELEASE_REPO}"
                exit 1
              fi
            fi
          else
            if ! download_release "${tag}"; then
              echo "::error::Could not download or validate AI Scan release ${tag} from ${RELEASE_REPO}"
              exit 1
            fi
          fi
          implementation_version="${tag}"
        fi

        if [[ -f "${TOOLS}" ]]; then
          if ! bun_version="$(tar -xJOf "${tarball}" ./ai-scan-bun-version)"; then
            echo "::error::AI Scan archive ${tarball} does not contain a readable ai-scan-bun-version stamp"
            exit 1
          fi
          if [[ ! "${bun_version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::AI Scan archive ${tarball} contains an invalid Bun version: ${bun_version}"
            exit 1
          fi
        fi

        {
          echo "tarball=${tarball}"
          echo "bun-version=${bun_version}"
          echo "implementation-version=${implementation_version}"
          echo "action-started-at=${action_started_at}"
        } >>"${GITHUB_OUTPUT}"

    - name: Set up Node.js for Copilot CLI
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 22

    # AI Scan ships as a JavaScript bundle rather than a self-contained
    # executable, so the runtime it needs is downloaded here from Bun's own
    # upstream instead of being redistributed inside our release asset.
    #
    # The archive records the Bun version that built the bundle. Resolve that
    # version before setup so independently released tools assets remain
    # compatible with action versions already in use.
    - name: Set up Bun for AI Scan
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: ${{ steps.resolve.outputs.bun-version }}

    # Unpacking is its own step so its result (`package-dir`) is a step
    # output every later step can read.
    - name: Unpack AI Scan
      id: unpack
      shell: bash
      env:
        ARGUS_TARBALL: ${{ steps.resolve.outputs.tarball }}
      run: |
        package_dir="$(bash "${GITHUB_ACTION_PATH}/unpack.sh" "${RUNNER_TEMP}" "${ARGUS_TARBALL}")"
        echo "package-dir=${package_dir}" >>"${GITHUB_OUTPUT}"

    - name: Run AI Scan
      shell: bash
      env:
        # The runner exports the repository, ref, SHA, and workspace.
        # The action forwards credentials plus its source-root and
        # baseline-ref inputs; run.sh maps the Copilot-specific values
        # to the environment expected by AI Scan and the Copilot SDK.
        GITHUB_TOKEN: ${{ inputs.token }}
        ARGUS_COPILOT_TOKEN: ${{ inputs.copilot-token }}
        ARGUS_COPILOT_INTEGRATION_ID: ${{ inputs.copilot-integration-id }}
        ARGUS_PACKAGE_DIR: ${{ steps.unpack.outputs.package-dir }}
        ARGUS_ACTION_VERSION: ${{ github.action_ref }}
        ARGUS_IMPLEMENTATION_VERSION: ${{ steps.resolve.outputs.implementation-version }}
        ARGUS_ACTION_STARTED_AT: ${{ steps.resolve.outputs.action-started-at }}
        ARGUS_SOURCE_ROOT: ${{ inputs.source-root }}
        ARGUS_BASELINE_REF: ${{ inputs.baseline-ref }}
      # `GITHUB_ACTION_PATH` and `RUNNER_TEMP` are exported by the
      # runner, so they need no forwarding; only `ARGUS_PACKAGE_DIR` —
      # a step output rather than an ambient value — does.
      run: bash "${GITHUB_ACTION_PATH}/run.sh" "${RUNNER_TEMP}" "${ARGUS_PACKAGE_DIR}"

    - name: Upload raw AI Scan findings
      if: always() && runner.debug == '1'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: argus-core-raw-output
        path: ${{ runner.temp }}/argus-output
        if-no-files-found: warn
