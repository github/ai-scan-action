# Consumer-facing action, published from this directory to a standalone action repository.
name: AI Scan
description: Run AI Scan on the current repository to detect and report security vulnerabilities.

inputs:
  token:
    description: GitHub token used for Copilot requests and code scanning access.
    required: false
    default: ${{ github.token }}
  copilot-token:
    description: GitHub token used for Copilot requests only. Overrides token.
    required: false
    default: ''
  copilot-integration-id:
    description: GitHub Copilot integration ID used for Copilot requests.
    required: false
    default: ''
  tools:
    description: >
      Path to a locally built AI Scan tools archive, or a release tag on the
      action's own repository (defaults to `latest`) to download that asset
      from. The action runs Node bundles (`argus.mjs`) and older Bun bundles
      (`argus.js` with an `ai-scan-bun-version` stamp). For unset or
      `latest`, the `use_next_release` feature flag can
      select the latest non-draft release if it is a prerelease; lookup,
      download, or validation failures fall back to `latest`. Only values
      starting with `/`, `./`, or `../` are checked for an existing file and
      used as-is; use `./archive.tar.xz` or `./dist/archive.tar.xz` for an
      archive relative to the current directory. Everything else is treated
      as a tag.
    required: false
    default: latest
  source-root:
    description: Path of the root source code directory, relative to $GITHUB_WORKSPACE.
    required: false
    default: .
  baseline-ref:
    description: Git ref of the baseline to compare against. Ignored for pull_request events.
    required: false
    default: ${{ github.ref }}

runs:
  using: composite
  steps:
    # Capture the action's start before setting up the resolver's runtime.
    - id: started
      shell: bash
      run: echo "action-started-at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >>"${GITHUB_OUTPUT}"

    - name: Set up Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 22

    - id: resolve
      shell: bash
      env:
        TOOLS: ${{ inputs.tools }}
        RELEASE_REPO: ${{ github.action_repository }}
        GH_TOKEN: ${{ inputs.token }}
        GITHUB_API_URL: ${{ github.api_url }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        ACTION_STARTED_AT: ${{ steps.started.outputs.action-started-at }}
      run: node "${GITHUB_ACTION_PATH}/resolve-tools.mjs"

    # TODO(bun-compat): Remove this step after production bundles use Node.
    # Bundles built before the switch to Node.js contain `argus.js`, which
    # runs on Bun. Such an archive records the Bun version that built it,
    # so this sets up that exact version. Node bundles (`argus.mjs`) do not
    # need Bun.
    - name: Set up Bun for AI Scan
      if: steps.resolve.outputs.runtime == 'bun'
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: ${{ steps.resolve.outputs.bun-version }}

    # Unpacking is its own step so its result (`package-dir`) is a step
    # output every later step can read.
    - name: Unpack AI Scan
      id: unpack
      shell: bash
      env:
        ARGUS_TARBALL: ${{ steps.resolve.outputs.tarball }}
        ARGUS_RUNTIME: ${{ steps.resolve.outputs.runtime }}
        ARGUS_BUN_VERSION: ${{ steps.resolve.outputs.bun-version }}
      run: |
        package_dir="$(bash "${GITHUB_ACTION_PATH}/unpack.sh" "${RUNNER_TEMP}" "${ARGUS_TARBALL}")"
        echo "package-dir=${package_dir}" >>"${GITHUB_OUTPUT}"

    - id: run-ai-scan
      name: Run AI Scan
      shell: bash
      env:
        # The runner exports the repository, ref, SHA, and workspace.
        # The action forwards credentials plus its source-root and
        # baseline-ref inputs; run.sh maps the Copilot-specific values
        # to the environment expected by AI Scan and the Copilot SDK.
        GITHUB_TOKEN: ${{ inputs.token }}
        ARGUS_COPILOT_TOKEN: ${{ inputs.copilot-token }}
        ARGUS_COPILOT_INTEGRATION_ID: ${{ inputs.copilot-integration-id }}
        ARGUS_PACKAGE_DIR: ${{ steps.unpack.outputs.package-dir }}
        ARGUS_RUNTIME: ${{ steps.resolve.outputs.runtime }}
        ARGUS_ACTION_VERSION: ${{ github.action_ref }}
        ARGUS_IMPLEMENTATION_VERSION: ${{ steps.resolve.outputs.implementation-version }}
        ARGUS_ACTION_STARTED_AT: ${{ steps.resolve.outputs.action-started-at }}
        ARGUS_SOURCE_ROOT: ${{ inputs.source-root }}
        ARGUS_BASELINE_REF: ${{ inputs.baseline-ref }}
        ARGUS_TELEMETRY_OUTBOX: ${{ runner.temp }}/argus-telemetry-outbox
      # `GITHUB_ACTION_PATH` and `RUNNER_TEMP` are exported by the
      # runner, so they need no forwarding; only `ARGUS_PACKAGE_DIR` —
      # a step output rather than an ambient value — does.
      run: bash "${GITHUB_ACTION_PATH}/run.sh" "${RUNNER_TEMP}" "${ARGUS_PACKAGE_DIR}"

    # Sends the final telemetry report of a scan that died before it could
    # (killed, out of memory, timed out, cancelled). Composite actions have
    # no `post:` hook, so this step only sees the outcome of the scan step
    # above, not that of later steps of the calling job (github/argus#210).
    # It sends to the destination the scan stored in the outbox, with the
    # same token as the scan. It fails when the scan left no outbox
    # (the scan never got going), which `continue-on-error` keeps from
    # failing the action: telemetry must not.
    - name: Finalize AI Scan telemetry
      if: always() && steps.unpack.outcome == 'success'
      shell: bash
      continue-on-error: true
      working-directory: ${{ steps.unpack.outputs.package-dir }}
      env:
        GITHUB_TOKEN: ${{ inputs.token }}
        ARGUS_STEP_OUTCOME: ${{ steps.run-ai-scan.outcome }}
        ARGUS_TELEMETRY_OUTBOX: ${{ runner.temp }}/argus-telemetry-outbox
        ARGUS_RUNTIME: ${{ steps.resolve.outputs.runtime }}
        ARGUS_ENTRY_POINT: ${{ steps.resolve.outputs.entry-point }}
      run: '"${ARGUS_RUNTIME}" "${ARGUS_ENTRY_POINT}" finalize-telemetry'

    - name: Upload raw AI Scan findings
      if: always() && runner.debug == '1'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: argus-core-raw-output
        path: ${{ runner.temp }}/argus-output
        if-no-files-found: warn
